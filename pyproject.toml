[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lamoo-bmas"
version = "0.1.0"
description = "Small LaMOO-inspired batched ask/tell hyperparameter search"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "scipy>=1.9", "scikit-learn>=1.2"]

[project.urls]
Repository = "https://github.com/SKYdayDUCK/LaMOO-BMAS"

[tool.setuptools.packages.find]
where = ["."]
include = ["pareto_search*"]
